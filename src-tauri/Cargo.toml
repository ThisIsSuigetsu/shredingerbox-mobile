[package]
name = "shredingerbox-mobile"
version = "0.1.0"
description = "ShredingerBox — простой VPN-клиент на sing-box для телефона"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "shredingerbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
