# Выпуск ShredingerBox для Android: при отправке метки вида v0.2.0 собирает ядро,
# подписанный APK для arm64 и публикует релиз. Установленное приложение увидит
# релиз и предложит обновиться.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   - файл ключа .jks в base64
#   ANDROID_KEYSTORE_PASSWORD - пароль хранилища
#   ANDROID_KEY_ALIAS         - имя ключа в хранилище
#   ANDROID_KEY_PASSWORD      - пароль ключа
name: Release
# Без этого в списке Actions сборка называется по сообщению последнего коммита.
run-name: ShredingerBox ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Все действия закреплены по хешу коммита, а не по метке: метку можно перевесить,
# а этой сборке достаётся ключ подписи APK. Версия - в комментарии рядом.
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Версия в метке совпадает с package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Метка $GITHUB_REF_NAME, а в package.json $version - поднимите версию в package.json, tauri.conf.json и Cargo.toml"
            exit 1
          fi

      # Описание релиза: раздел этой версии из CHANGELOG.md и CHANGELOG.en.md - их же
      # приложение показывает в окне обновления на своём языке, - и инструкция для первой
      # установки (окно обновления её отрезает). Английская половина начинается с «## English».
      - name: Описание релиза из CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v head="## $version" '
              $0 == head { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$1"
          }
          section CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          section CHANGELOG.en.md > "$RUNNER_TEMP/changes.en.md"
          for f in changes.md changes.en.md; do
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/$f"; then
              echo "::error::Нет раздела «## $version» в CHANGELOG.md или CHANGELOG.en.md - допишите, что изменилось"
              exit 1
            fi
          done
          {
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "**Первая установка**"
            echo "1. Скачайте файл \`.apk\` ниже на телефон."
            echo "2. Откройте его. Android спросит, можно ли устанавливать приложения из браузера или «Файлов», - разрешите."
            echo "3. Откройте ShredingerBox и добавьте подписку или ключ, которые вам прислали: вставьте в «Добавить», отсканируйте QR-код или просто скопируйте - приложение предложит добавить само."
            echo "4. Нажмите большую кнопку. В первый раз Android попросит разрешить VPN."
            echo
            echo "---"
            echo
            echo "## English"
            echo
            cat "$RUNNER_TEMP/changes.en.md"
            echo
            echo "**First install**"
            echo "1. Download the \`.apk\` file below to your phone."
            echo "2. Open it. Android will ask whether apps may be installed from the browser or \"Files\" - allow it."
            echo "3. Open ShredingerBox and add the subscription or key you were sent: paste it in \"Add\", scan the QR code, or just copy it - the app will offer to add it."
            echo "4. Tap the big button. The first time, Android will ask to allow the VPN."
          } > "$RUNNER_TEMP/release.md"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Ядро sing-box (libbox.aar)
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" ARCHS=arm64 bash scripts/build-libbox.sh

      - name: Зависимости npm
        run: npm ci

      - name: Ключ подписи
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Сборка APK
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --apk --target aarch64 --ci
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Имя файла
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "out/ShredingerBox-${GITHUB_REF_NAME#v}-arm64.apk"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ShredingerBox ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release.md
          files: out/*.apk
